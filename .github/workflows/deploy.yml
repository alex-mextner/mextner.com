name: Deploy to Production

# Build on a GitHub-hosted runner, publish on the home server (odroid) through its
# self-hosted runner. Public traffic reaches the odroid via Cloudflare Tunnel, so
# the server has no inbound ports and needs no SSH secrets here.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true # Hugo themes
          fetch-depth: 0 # .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            public/
            Caddyfile
          retention-days: 7

  deploy:
    needs: build
    runs-on: [self-hosted, odroid]
    # Serialize only publication; never interrupt a running rsync --delete.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Publish
        run: |
          rsync -a --delete \
            --exclude '.DS_Store' --exclude '*.swp' --exclude 'Thumbs.db' \
            site/public/ /var/www/mextner.com/
          # caddy-mextner.service runs with --watch and reloads on change.
          install -m 644 site/Caddyfile /var/www/mextner.com.caddy/Caddyfile

      - name: Smoke check
        run: |
          # Give caddy --watch time to pick up a changed Caddyfile.
          for _ in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: mextner.com' http://127.0.0.1:8081/ || true)
            echo "origin status: $code"
            [ "$code" = 200 ] && exit 0
            sleep 2
          done
          exit 1
